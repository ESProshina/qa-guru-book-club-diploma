plugins {
    id 'java'
    id 'io.qameta.allure' version '3.0.0'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

def allureVersion = '2.25.0'
def aspectjVersion = '1.9.22'

allure {
    report {
        version.set(allureVersion)
    }
    adapter {
        aspectjWeaver.set(true)
        frameworks {
            junit5 {
                adapterVersion.set(allureVersion)
            }
        }
    }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'io.rest-assured:json-schema-validator:5.4.0'
    testImplementation 'io.rest-assured:rest-assured:5.4.0'
    testImplementation 'org.assertj:assertj-core:3.25.3'

    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0'
    testImplementation "io.qameta.allure:allure-rest-assured:$allureVersion"
    testImplementation "io.qameta.allure:allure-junit5:$allureVersion"
    testImplementation "org.aspectj:aspectjweaver:$aspectjVersion"

    testImplementation 'net.datafaker:datafaker:2.1.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    testCompileOnly 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'
    testImplementation 'com.codeborne:selenide:7.6.0'
    testImplementation 'io.qameta.allure:allure-selenide:2.29.0'
}

test {
    useJUnitPlatform()

    systemProperties(System.getProperties())

    // Явно пробрасываем ключевые параметры (на случай, если выше не сработает)
    if (System.getProperty("remote")) {
        systemProperty "remote", System.getProperty("remote")
        systemProperty "selenide.remote", System.getProperty("remote")
    }
    if (System.getProperty("baseUrl")) {
        systemProperty "baseUrl", System.getProperty("baseUrl")
    }
    if (System.getProperty("browser")) {
        systemProperty "browser", System.getProperty("browser")
    }


    if (System.getProperty("skipUi") == "true") {
        exclude '**/tests/ui/**'
    }

    systemProperty "allure.results.directory", "build/allure-results"

    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "short"
        showExceptions true
        showCauses true
    }

    doFirst {
        def aspectjWeaver = configurations.testRuntimeClasspath.find {
            it.name.contains('aspectjweaver')
        }
        if (aspectjWeaver != null) {
            jvmArgs "-javaagent:${aspectjWeaver.absolutePath}"
        }
    }
}